spring:
  application:
    name: vayora-core-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vayora}
    username: ${SPRING_DATASOURCE_USERNAME:vayora}
    password: ${SPRING_DATASOURCE_PASSWORD:vayora}
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # A cache that is down must cost a moment, not a request.
      timeout: 1s
      connect-timeout: 1s
    mongodb:
      # The short server selection timeout keeps a MongoDB outage from stalling requests.
      uri: ${MONGO_URI:mongodb://localhost:27017/vayora?serverSelectionTimeoutMS=2000}
  mail:
    # Only used when SPRING_MAIL_HOST is set. A mail server that does not answer costs
    # seconds, not a hung request.
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  mvc:
    problemdetails:
      enabled: true

vayora:
  jwt:
    # Shared HS256 secret: core-api signs, gateway verifies. At least 32 bytes.
    secret: ${JWT_SECRET:}
    ttl: PT12H
  cors:
    # Origins of the browser app, comma-separated.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    # The administrator created at startup. Leave the email empty to have none.
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  intel:
    url: ${INTEL_URL:http://localhost:8000}
    # Longest core-api waits for a score before going on without one.
    timeout: PT2S
  hazard:
    # When confirmed bookings are re-scored (corridor time). "-" turns it off.
    scoring-cron: ${HAZARD_SCORING_CRON:0 0 6 * * *}
  payment:
    # The platform's fee, as a fraction of the fare, charged on top of it.
    service-fee-rate: 0.10
    # A lower fee on rides by a driver who keeps their rides (feature 94): at least
    # min-completed rides completed, and none withdrawn among those due to leave within the
    # window before now, or later. From the record alone, never from a prediction, and
    # never above the standard rate. The values are the authors' assumptions.
    kept-rides:
      fee-rate: 0.07
      min-completed: 10
      window: P90D
    # Razorpay (feature 46). With both keys, passengers pay in Razorpay's checkout and are
    # refunded through it; without them, the simulated provider as before. A key starting
    # rzp_test_ is Razorpay's test mode: no real money moves, and every record says so.
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      base-url: https://api.razorpay.com
      timeout: PT10S
  invoice:
    # A tax invoice for what VAYORA itself charges, on real payments only: off until all three
    # are set. The rate and the SAC code are the authors' reading, for a tax adviser to confirm
    # before real use. GST is taken out of the amount charged, so no price changes.
    gstin: ${VAYORA_GSTIN:}
    legal-name: ${VAYORA_LEGAL_NAME:}
    address: ${VAYORA_LEGAL_ADDRESS:}
    gst-rate: 0.18
    sac-code: "9985"
  pass:
    # On sale to passengers. A pass waives the service fee on bookings requested while it
    # runs. Prices are the authors' assumptions, not market research.
    offers:
      - kind: WEEKLY
        days: 7
        price: 99
      - kind: MONTHLY
        days: 30
        price: 299
      - kind: ANNUAL
        days: 365
        price: 2499
  refund:
    # A passenger cancelling a booking the driver had accepted gets this share of the
    # fare back, by how long before boarding they cancel. Later than the last tier: none.
    tiers:
      - at-least-before: PT48H
        fare-share: 1.0
      - at-least-before: PT24H
        fare-share: 0.5
  osrm:
    # The routing service. Empty means none: routes are then straight lines between stops.
    url: ${OSRM_URL:}
    # The same map built for walking (feature 91). Empty means none: walks to and from stops
    # are then estimated in a straight line at vayora.search.walking-kmh, and said to be.
    foot-url: ${OSRM_FOOT_URL:}
    timeout: PT3S
    cache-ttl: P7D
    # Only used to guess a driving time when there is no road route.
    fallback-speed-kmh: 50
  detour:
    # Detour tolerance (feature 28): the most a driver may offer in all on one ride, and how
    # far from a ride's road a passenger's start may be for a pickup there to be worked out.
    max-minutes: 30
    reach-km: 8
  google:
    # "Sign in with Google" is off unless this is set to an OAuth client ID from the Google
    # Cloud console (a Web application client whose origins include the web app's address).
    client-id: ${GOOGLE_CLIENT_ID:}
    # Where Google publishes the keys its ID tokens are signed with, and the issuers it uses.
    jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
    issuers: accounts.google.com,https://accounts.google.com
  mail:
    # The sender address for real email. Email is sent only when SPRING_MAIL_HOST names an
    # SMTP server; without one, copies and codes go to the simulated outbox as before.
    from: ${VAYORA_MAIL_FROM:}
  twilio:
    # A real telephony provider for texts (feature 64) and masked calls (feature 61). Set all
    # three or none; with none, texts go to the simulated outbox and calls are simulated, as
    # before. TWILIO_FROM must be a Twilio number that can text and call. With Twilio's test
    # credentials and TWILIO_FROM=+15005550006, Twilio answers as if it acted and does nothing.
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from: ${TWILIO_FROM:}
    base-url: https://api.twilio.com
    timeout: PT5S
  push:
    # The server's key pair, base64url. Empty: push notifications are off. Make a pair with
    # node scripts/vapid-keys.mjs; never commit a real private key.
    public-key: ${VAYORA_PUSH_PUBLIC_KEY:}
    private-key: ${VAYORA_PUSH_PRIVATE_KEY:}
    # Who push services can contact about this server's messages (RFC 8292).
    subject: ${VAYORA_PUSH_SUBJECT:mailto:vayora@example.invalid}
    # Push services a browser may name, and their subdomains; a subscription anywhere else is
    # refused. Comma-separated.
    allowed-hosts: fcm.googleapis.com,updates.push.services.mozilla.com,notify.windows.com,push.apple.com
    # How long a push service keeps a message for a browser that is offline.
    time-to-live: P1D
  photo:
    # The largest upload accepted. What is stored is smaller: re-encoded and scaled down.
    max-upload: 5MB
    # The longest side of a stored photo.
    max-side-pixels: 800
    # Refused before decoding above this, so a small file cannot claim an enormous picture.
    max-source-pixels: 40000000
  supply:
    # Every morning, days from today to this many ahead are checked for searches that found
    # no ride.
    detection-cron: "0 0 6 * * *"
    horizon-days: 7
    # A day and stretch counts as a gap with at least this many such searches.
    min-empty-searches: 3
    # A search's ends are named by the nearest ride stop within this distance.
    near-stop-km: 5
    # Drivers who completed a ride on the stretch within this many days may be told...
    driver-history-days: 90
    # ...but no driver more than once in this many days...
    days-between-nudges: 7
    # ...and no more than this many drivers about one gap. All assumptions, not estimates.
    most-nudges-per-gap: 5
  tiers:
    # A passenger who chose Flexible is booked on the closest other ride within this much of
    # the withdrawn one; Any time widens it to the whole day.
    flexible-window: PT2H
    # Flexible is suggested on a ride whose driver has completed fewer than this share of the
    # rides they finished or withdrew. An assumption, not an estimate.
    suggest-below: 0.9
  route:
    # Rest stops and chargers this close to a route, in a straight line, are shown to the driver.
    stopovers-within-km: 2
    # On a longer drive, the rest stop nearest the point this much driving in is suggested
    # for a break. An assumption, not a rule from any regulation.
    break-after: PT2H
  search:
    # How far, in a straight line, a passenger may be from a stop for a ride to match.
    max-access-km: 5
    # For a rough walking time to and from stops, shown with each result. Distances are in a
    # straight line, so the real walk is longer.
    walking-kmh: 4.5
    # Two-sided match scoring (feature 76), out of 100: these four parts add up to 100,
    # "preference" counting once for each of smoking, pets, music and conversation. Only what
    # both people said, distance, price and the driver's record: never a prediction.
    # The weights are the authors' assumptions.
    match:
      distance: 25
      price: 20
      record: 15
      preference: 10
  rickshaw:
    # An auto-rickshaw to or from a stop is offered with a result when the walk is at least
    # this far in a straight line (feature 91). The authors' choice.
    offer-beyond-metres: 1000
    # Published meter fares. A town is listed only where the source gives both how far the
    # minimum fare goes and the rate after it; any other town gets a time but no fare.
    # Kolhapur's revision of 1 March 2025 (Rs 25 minimum, Rs 23 a km after, as reported) is
    # left out: no report found says how far its minimum goes.
    fares:
      - town: Pune
        lat: 18.5204
        lon: 73.8567
        # Pune city and Pimpri-Chinchwad, which the decision covers.
        radius-km: 25
        minimum-fare: 30
        minimum-km: 1.5
        per-km: 20
        since: 2026-09-01
        source: "Pune Regional Transport Authority, as reported by Punekar News, 4 August 2026"
  pricing:
    # Per seat. Only a suggestion offered to the driver, never applied automatically.
    suggested-rupees-per-km: 2.0
  reminders:
    # A passenger with a confirmed seat is asked, once, this long before boarding, to release
    # it if their plans have changed (feature 79). Nothing is cancelled or priced for them,
    # and the message says nothing about any model. "-" in the cron turns it off.
    release-before: PT48H
    release-cron: ${RELEASE_REMINDER_CRON:0 */10 * * * *}
    # Whom it asks (features 79 and 80), as chosen on 2026-10-20: only bookings the
    # durability model last rated below the threshold, and when more than the budget allows,
    # those intel's contact scheduler chooses, as the simulator's B5 (whose values these are).
    # Not chosen: due again next run. Unscored, or the scheduler unreachable: not asked.
    # enabled: false asks everyone alike. Every value is the authors' assumption.
    targeting:
      enabled: true
      survival-threshold: 0.8
      contacts-per-round: 2
      contacts-per-ride: 1
      seats-per-departure-day: 4
      refill-horizon-hours: 168
      solver-time-limit-seconds: 5
  referral:
    # What each side of a referral who is a passenger gets once the invited member completes a
    # first trip (feature 72): a free pass of this kind (WEEKLY, MONTHLY or ANNUAL), or NONE.
    # Drivers get nothing: a pass only waives the fee a passenger pays. An assumption.
    reward-pass: WEEKLY
  calling:
    # Masked calls (simulated, feature 61) between the two sides of a confirmed booking
    # open this long before boarding.
    opens-before: PT24H
  trip:
    # How long before the scheduled departure a driver may start the ride.
    early-start: PT1H
  booking:
    # A request the driver has not answered is closed, and everything returned, once it
    # is this old, or once boarding is this near, whichever comes first.
    answer-within: PT12H
    close-before-boarding: PT2H
    # A ride already on the road can still be booked from a stop it is due at no sooner
    # than this, and only if it confirms instantly: a driver at the wheel answers nothing.
    # The schedule is all the platform knows of a ride's progress, hence the margin.
    mid-route-lead: PT30M
    # How often unanswered requests are looked for. "-" turns it off.
    expiry-cron: ${BOOKING_EXPIRY_CRON:0 */5 * * * *}
  levels:
    # Experience levels, lowest first. A member holds the highest whose every condition
    # they meet. The thresholds are the authors' assumptions.
    levels:
      - name: NEWCOMER
        min-completed-trips: 0
        min-ratings: 0
        confirmed-email: false
        confirmed-phone: false
      - name: INTERMEDIATE
        min-completed-trips: 3
        min-ratings: 0
        confirmed-email: true
        confirmed-phone: false
      - name: EXPERIENCED
        min-completed-trips: 10
        min-average-stars: 4.0
        min-ratings: 3
        confirmed-email: true
        confirmed-phone: false
      - name: EXPERT
        min-completed-trips: 25
        min-average-stars: 4.4
        min-ratings: 10
        confirmed-email: true
        confirmed-phone: true
      - name: AMBASSADOR
        min-completed-trips: 50
        min-average-stars: 4.6
        min-ratings: 25
        confirmed-email: true
        confirmed-phone: true
  rating:
    # A trip nobody has rated gets one reminder this long after it is completed.
    remind-after: PT24H
    reminder-cron: ${RATING_REMINDER_CRON:0 0 * * * *}
  hold:
    # How long seats a passenger asked to hold are kept from other passengers.
    ttl: PT5M
  verification:
    # One-time codes proving an email address or a phone number.
    code-ttl: PT10M
    resend-after: PT1M
    max-attempts: 5
    # Codes one member may ask for on one channel in any 24 hours: bounds the guesses
    # and the messages sent.
    max-codes-per-day: 10
  sign-in:
    # Wrong passwords for one email address or phone number before signing in with it is
    # refused, and the window that begins with the first wrong one.
    max-failures: 5
    window: PT15M
  sos:
    # Pressing the emergency button again within this long repeats nothing.
    repeat-window: PT1M

server:
  port: 8080

# The API described from the controllers: /swagger-ui.html to read and try it, /v3/api-docs as
# OpenAPI JSON. Public, as the endpoints themselves still demand a token.
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    persist-authorization: true

management:
  health:
    redis:
      # Only a cache: core-api is healthy without it.
      enabled: false
    mongo:
      # Notifications are a courtesy; core-api is healthy without them.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
