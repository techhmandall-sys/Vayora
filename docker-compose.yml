name: vayora

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vayora}
      POSTGRES_USER: ${POSTGRES_USER:-vayora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vayora}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:7
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Downloads the regional extract once and clips it to the corridor bounding box.
  osrm-data:
    build: ./infra/osrm
    environment:
      OSRM_PBF_URL: ${OSRM_PBF_URL:-https://download.geofabrik.de/asia/india/western-zone-latest.osm.pbf}
      OSRM_BBOX: ${OSRM_BBOX:-73.4,16.4,74.9,18.9}
    volumes:
      - osrmdata:/data

  # Builds the MLD routing graph from the clipped extract; skipped once built.
  osrm-build:
    image: osrm/osrm-backend:v5.25.0
    depends_on:
      osrm-data:
        condition: service_completed_successfully
    volumes:
      - osrmdata:/data
    command:
      - sh
      - -c
      - |
        set -e
        if [ -f /data/corridor.osrm.ready ]; then echo "OSRM graph already built"; exit 0; fi
        osrm-extract -p /opt/car.lua /data/corridor.osm.pbf
        osrm-partition /data/corridor.osrm
        osrm-customize /data/corridor.osrm
        touch /data/corridor.osrm.ready

  osrm:
    image: osrm/osrm-backend:v5.25.0
    depends_on:
      osrm-build:
        condition: service_completed_successfully
    ports:
      - "${OSRM_PORT:-5000}:5000"
    volumes:
      - osrmdata:/data
    command: ["osrm-routed", "--algorithm", "mld", "/data/corridor.osrm"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5000"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The same clipped extract built for walking (feature 91): times to and from stops on
  # footpaths. Its own files beside the driving graph; skipped once built.
  osrm-build-foot:
    image: osrm/osrm-backend:v5.25.0
    depends_on:
      osrm-data:
        condition: service_completed_successfully
    volumes:
      - osrmdata:/data
    command:
      - sh
      - -c
      - |
        set -e
        if [ -f /data/corridor-foot.osrm.ready ]; then echo "OSRM walking graph already built"; exit 0; fi
        cp /data/corridor.osm.pbf /data/corridor-foot.osm.pbf
        osrm-extract -p /opt/foot.lua /data/corridor-foot.osm.pbf
        osrm-partition /data/corridor-foot.osrm
        osrm-customize /data/corridor-foot.osrm
        touch /data/corridor-foot.osrm.ready

  # Reached only by core-api, so not published on the host.
  osrm-foot:
    image: osrm/osrm-backend:v5.25.0
    depends_on:
      osrm-build-foot:
        condition: service_completed_successfully
    volumes:
      - osrmdata:/data
    command: ["osrm-routed", "--algorithm", "mld", "/data/corridor-foot.osrm"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5000"]
      interval: 5s
      timeout: 3s
      retries: 20

  core-api:
    build: ./core-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vayora}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-vayora}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-vayora}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-dev-only-change-me}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      INTEL_URL: http://intel:8000
      OSRM_URL: http://osrm:5000
      OSRM_FOOT_URL: http://osrm-foot:5000
      REDIS_HOST: redis
      MONGO_URI: mongodb://mongo:27017/${MONGO_DB:-vayora}?serverSelectionTimeoutMS=2000
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Push notifications are off unless both are set (node scripts/vapid-keys.mjs).
      VAYORA_PUSH_PUBLIC_KEY: ${VAYORA_PUSH_PUBLIC_KEY:-}
      VAYORA_PUSH_PRIVATE_KEY: ${VAYORA_PUSH_PRIVATE_KEY:-}
      VAYORA_PUSH_SUBJECT: ${VAYORA_PUSH_SUBJECT:-mailto:vayora@example.invalid}
      # "Sign in with Google" is off unless set (see DEPLOYMENT.md).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Real text messages through Twilio: all three or none. None: the simulated outbox.
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      # Payments through Razorpay: both or neither. Neither: the simulated provider.
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      # Tax invoices: all three or none (see DEPLOYMENT.md). None: receipts say they are not one.
      VAYORA_GSTIN: ${VAYORA_GSTIN:-}
      VAYORA_LEGAL_NAME: ${VAYORA_LEGAL_NAME:-}
      VAYORA_LEGAL_ADDRESS: ${VAYORA_LEGAL_ADDRESS:-}
    ports:
      - "${CORE_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  intel:
    # Built from the repository root: a live what-if run needs the simulator and its configs.
    build:
      context: .
      dockerfile: intel/Dockerfile
    environment:
      # Checks an administrator's token for a live what-if run, as the gateway checks tokens.
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-dev-only-change-me}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "${INTEL_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  gateway:
    build: ./gateway
    # The gateway also retries on its own; this only spares it a slow start.
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-dev-only-change-me}
      MONGO_URI: mongodb://mongo:27017/${MONGO_DB:-vayora}
      CORE_API_URL: http://core-api:8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: http://localhost:${CORE_API_PORT:-8080}
        VITE_GATEWAY_URL: http://localhost:${GATEWAY_PORT:-3000}
        VITE_INTEL_URL: http://localhost:${INTEL_PORT:-8000}
    ports:
      - "${WEB_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Python 3.11 environment for vayora_events, sim and experiments. Not started by
  # `docker compose up`; run with `docker compose run --rm research`.
  research:
    profiles: ["research"]
    build:
      context: .
      dockerfile: infra/research/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      VAYORA_DB_URL: postgresql://${POSTGRES_USER:-vayora}:${POSTGRES_PASSWORD:-vayora}@postgres:5432/${POSTGRES_DB:-vayora}
    volumes:
      - .:/work

  # Runs the core-api test suite on Java 21. Testcontainers starts its own PostGIS
  # through the host's Docker socket. `docker compose run --rm core-api-tests`.
  core-api-tests:
    profiles: ["test"]
    image: maven:3.9-eclipse-temurin-21
    working_dir: /work/core-api
    command: ["mvn", "-B", "test"]
    environment:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/work
      - /var/run/docker.sock:/var/run/docker.sock
      - m2cache:/root/.m2

volumes:
  m2cache:
  pgdata:
    # A database made before the project was called VAYORA lives in journex_pgdata: set
    # PG_VOLUME=journex_pgdata in .env to keep using it rather than start empty.
    name: ${PG_VOLUME:-vayora_pgdata}
  mongodata:
  osrmdata:
