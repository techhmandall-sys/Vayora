<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>VAYORA: offline</title>
    <!-- Shown by the service worker when a page cannot be fetched. Self-contained: nothing else
         is cached, so it may load nothing from the network. In all three of the app's languages,
         since the reader's choice lives in the app this page stands in for. -->
    <style>
      :root { --canvas: #f2f2f7; --surface: #fff; --text: #141416; --muted: #54545a; --tint: #0f766e; }
      @media (prefers-color-scheme: dark) {
        :root { --canvas: #000; --surface: #1c1c1e; --text: #f5f5f7; --muted: #aeaeb4; --tint: #40dcc7; }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        background: var(--canvas); color: var(--text);
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Devanagari", "Nirmala UI", sans-serif;
      }
      main { width: 100%; max-width: 26rem; background: var(--surface); border-radius: 24px; padding: 28px 24px; text-align: center;
        box-shadow: 0 1px 2px rgb(0 0 0 / 0.04), 0 10px 30px -18px rgb(0 0 0 / 0.18); }
      svg { width: 56px; height: 56px; }
      h1 { font-size: 22px; margin: 16px 0 4px; }
      p { margin: 0 0 4px; color: var(--muted); }
      .lang { margin-top: 16px; }
      button { margin-top: 20px; border: 0; border-radius: 999px; padding: 12px 22px; font: inherit; font-weight: 600;
        color: #fff; background: #0f766e; cursor: pointer; }
      button:focus-visible { outline: 3px solid var(--tint); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14b8a6" /><stop offset="1" stop-color="#0f766e" /></linearGradient></defs>
        <rect width="32" height="32" rx="9" fill="url(#g)" />
        <path d="M9 22c3-9 11-3 14-12" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" />
        <circle cx="9" cy="22" r="2.6" fill="#fff" /><circle cx="23" cy="10" r="2.6" fill="#fff" />
      </svg>
      <h1>You are offline</h1>
      <p>VAYORA needs a connection to show rides and bookings. Try again once you are back online.</p>
      <p class="lang" lang="hi">आप ऑफ़लाइन हैं। सवारियाँ और बुकिंग देखने के लिए इंटरनेट चाहिए।</p>
      <p lang="mr">तुम्ही ऑफलाइन आहात. प्रवास आणि बुकिंग पाहण्यासाठी इंटरनेट हवे.</p>
      <button type="button" onclick="location.reload()">Try again · फिर कोशिश करें · पुन्हा प्रयत्न करा</button>
    </main>
  </body>
</html>
