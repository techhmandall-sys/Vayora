# The synthetic world every variant is run in: who supplies rides, who searches, and
# how bookings fall apart. Variants change the platform's policy, never this file.
#
# EVERY VALUE HERE IS A MODELLING ASSUMPTION. None is estimated from data. They are
# plausible magnitudes chosen so the corridor is neither empty nor saturated; results
# must be read as "under these assumptions", and the robustness sweeps exist to show
# how much the conclusions move when the assumptions do.

# Simulated instant of hour 0. The offset matters: event timestamps carry it.
start: "2026-01-05T00:00:00+05:30"

supply:
  # Mean rides departing per day (Poisson).
  rides_per_day: 12
  # Departure hour of day: weight. Morning and evening peaks.
  departure_hours: {6: 3, 7: 4, 8: 3, 9: 2, 14: 2, 16: 3, 17: 4, 18: 3}
  # Seats offered per ride: weight.
  seats: {1: 1, 2: 3, 3: 4, 4: 1}
  # A ride is published this many days before it departs (uniform).
  publish_lead_days_min: 1.0
  publish_lead_days_max: 7.0
  trip_duration_hours: 4.5
  # Probability a driver accepts a booking request.
  accept_probability: 0.85
  # Mean of the (exponential) time a driver takes to answer.
  response_delay_mean_hours: 2.0
  # Probability a driver withdraws a published ride before departure.
  withdraw_probability: 0.04

demand:
  # Mean searches per day (Poisson process, constant rate).
  searches_per_day: 60
  # Number of distinct people. Each search is made by one of them, chosen uniformly, so
  # people come back and build a history the platform can observe.
  population: 800
  # Preferred departure hour of day: weight.
  departure_hours: {6: 2, 7: 4, 8: 4, 9: 2, 14: 1, 16: 2, 17: 4, 18: 3, 19: 1}
  # A ride is a candidate if it leaves within this many hours of the preferred time.
  departure_tolerance_hours: 2.0
  # Seats wanted per search: weight.
  party_size: {1: 7, 2: 2, 3: 1}

  # Latent passenger types. These drive behaviour and are NEVER a model feature
  # (research integrity rule 1). A cancellation time is drawn from a Weibull hazard
  # over hours since the booking was accepted:
  #   shape < 1   hazard falls with time    cancels early if at all
  #   shape = 1   constant hazard
  #   shape > 1   hazard rises with time    cancels late
  # lead_days_mean is how far ahead the type wants to travel: exponential with this
  # mean, cut off at the booking horizon. It differs by type, which is one of the two
  # ways a type shows itself in what the platform can see (the other is history).
  types:
    committed:
      share: 0.40
      lead_days_mean: 2.0
      book_probability: 0.75
      weibull_shape: 1.0
      weibull_scale_hours: 2500
      no_show_probability: 0.01
      last_mile_sensitivity: 0.03
    flexible:
      share: 0.25
      lead_days_mean: 4.0
      book_probability: 0.65
      weibull_shape: 0.7
      weibull_scale_hours: 400
      no_show_probability: 0.02
      last_mile_sensitivity: 0.12
    opportunistic:
      share: 0.20
      lead_days_mean: 3.0
      book_probability: 0.80
      weibull_shape: 1.8
      weibull_scale_hours: 110
      no_show_probability: 0.06
      last_mile_sensitivity: 0.30
    deadline_bound:
      share: 0.15
      lead_days_mean: 1.0
      book_probability: 0.70
      weibull_shape: 1.3
      weibull_scale_hours: 600
      no_show_probability: 0.01
      last_mile_sensitivity: 0.08

  # The gap from a passenger's start to the stop they would board at: log-normal,
  # metres, independent of which ride they take. How much it speeds up a cancellation
  # is set per type above (last_mile_sensitivity); this only draws the gap itself.
  # offer_beyond_metres mirrors core-api's journex.rickshaw.offer-beyond-metres: beyond
  # it, a non-walk access option is shown, which is the boolean feature the model sees.
  last_mile:
    offset_metres_mean: 1200
    offset_metres_sigma: 0.9
    offer_beyond_metres: 500

  # An unobservable shock (illness, a change of plans) can hit any booking. From the
  # moment it hits, that booking's hazard is multiplied. No feature records it
  # (research integrity rule 2).
  shock:
    rate_per_day: 0.02
    hazard_multiplier: 15

  # How a passenger reacts when the platform asks them to reconfirm a booking. Only
  # variants that intervene use this. THESE NUMBERS DECIDE WHAT AN INTERVENTION IS WORTH
  # and nothing in a simulation can estimate them: treat every result that depends on
  # them as conditional, and sweep them.
  intervention_response:
    # A passenger who was going to cancel later anyway releases the seat now instead.
    early_release_probability: 0.5
    # A passenger who was going to travel is put off by being asked, and cancels.
    annoyed_cancel_probability: 0.02
    # Mean of the (exponential) time a passenger takes to answer.
    response_delay_mean_hours: 3.0

  # Whether a passenger left without a seat tries again: one who found nothing, whose
  # request the driver declined or never answered, or whose ride the driver withdrew.
  # A passenger who saw rides and chose not to book, or who cancelled, does not.
  # Without this, a seat released early can only ever be taken by a new arrival.
  retry:
    probability: 0.6
    # Mean of the (exponential) wait before searching again.
    delay_mean_hours: 6.0
    # Searches after the first. 0 turns retrying off.
    max_attempts: 2
  # Passengers who chose a flexible booking are rebooked by the platform at once when their
  # driver withdraws: the closest other open ride with the seats, within window_hours of the
  # withdrawn one (features 81 and 88). The rest search again, as above. 0 keeps every
  # earlier result exactly; the share is swept, not assumed (EXPERIMENT_PROTOCOL.md 17).
  flexible_booking:
    share: 0.0
    window_hours: 2.0
